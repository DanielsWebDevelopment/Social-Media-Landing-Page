<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nova — Build Something Great</title>
  <meta
    name="description"
    content="A simple landing page for testing HTML files inside Senthera."
  />

  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", sans-serif;
      background: #09090b;
      color: #fafafa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(124, 58, 237, 0.2), transparent 35%),
        #09090b;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 24px;
      color: #a1a1aa;
    }

    nav a:hover {
      color: #ffffff;
    }

    main {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 160px);
      padding: 96px 24px;
      text-align: center;
    }

    .hero {
      max-width: 760px;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: #c4b5fd;
      background: rgba(124, 58, 237, 0.1);
      font-size: 0.875rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .subtitle {
      max-width: 620px;
      margin: 24px auto 0;
      color: #a1a1aa;
      font-size: 1.125rem;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
    }

    .button {
      padding: 14px 22px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .button-primary {
      background: #7c3aed;
      color: #ffffff;
    }

    .button-primary:hover {
      background: #8b5cf6;
    }

    .button-secondary {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    .button-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    #message {
      min-height: 24px;
      margin-top: 24px;
      color: #c4b5fd;
    }

    footer {
      padding: 24px;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#">Nova</a>

    <nav aria-label="Main navigation">
      <a href="#features">Features</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <span class="badge">Now available in early access</span>

      <h1>Build something worth sharing.</h1>

      <p class="subtitle">
        Nova gives creators and developers a simple place to plan, build, and
        launch their next great idea.
      </p>

      <div class="actions">
        <button id="get-started" class="button button-primary" type="button">
          Get Started
        </button>

        <a class="button button-secondary" href="https://github.com">
          View on GitHub
        </a>
      </div>

      <p id="message" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <span>&copy; <span id="year"></span> Nova. All rights reserved.</span>
  </footer>

  <script src="app.js"></script>

  <script>
    const button = document.getElementById("get-started");
    const message = document.getElementById("message");
    const year = document.getElementById("year");

    year.textContent = new Date().getFullYear();

    button.addEventListener("click", () => {
      message.textContent = "Your landing page is working correctly.";
      console.log("Get Started button clicked.");
    });
  </script>
</body>
</html>
