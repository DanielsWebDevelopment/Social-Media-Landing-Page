name: Failing CI Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run intentionally failing test
        run: |
          node -e "
            const expected = 10;
            const actual = 7;

            if (actual !== expected) {
              console.error(\`Test failed: expected \${expected}, received \${actual}\`);
              process.exit(1);
            }
          "
