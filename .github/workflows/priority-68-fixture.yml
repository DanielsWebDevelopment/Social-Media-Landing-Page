name: Priority 68 Fixture CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-fixture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: priority-68-fixture

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: priority-68-fixture/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
